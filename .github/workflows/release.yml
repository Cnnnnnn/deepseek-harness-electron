name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Smoke test
        run: npm test
      - name: Build macOS universal
        run: npm run dist
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-universal
          path: dist/DeepSeek.Harness-universal-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows
        run: npm run dist:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: dist/DeepSeek.Harness-Setup-x64.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/mac-universal/DeepSeek.Harness-universal-mac.zip
            artifacts/win-x64/DeepSeek.Harness-Setup-x64.exe
